name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Builds, verifies and smoke-tests the installable beta ZIP (see docs/beta.md).
      - run: npm run test:package
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Same-installation update checks (docs/beta.md): build the earlier
      # production versions, 0.5.0, 0.6.0 and 0.7.0, from their own source at
      # these immutable commits, which the shallow checkout does not contain.
      - name: Fetch update-check baseline (Task 05, 0.5.0)
        run: git fetch --no-tags --depth=1 origin b323930f7d9580f426e7e8fee39b4242143c4844
      - name: Fetch update-check baseline (Task 07.1, 0.6.0)
        run: git fetch --no-tags --depth=1 origin 60e330b12d195908a44ad341a73e34678a5a697d
      - name: Fetch update-check baseline (Task 09.1, 0.7.0)
        run: git fetch --no-tags --depth=1 origin da475840933b21eab85553e8b2ad54c3e049bf90
      - run: npm run test:update
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Chrome Web Store listing images from the same verified beta ZIP, in a
      # disposable profile (docs/store/assets.md). Not part of the ZIP.
      - name: Generate and verify store assets from the beta ZIP
        run: npm run assets:store -- --reuse-package
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check store assets name this run's beta ZIP and head
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          report=artifacts/store-assets/store-assets-report.json
          zip_sha=$(cut -d' ' -f1 artifacts/beta/refund-reconciler-beta-*.zip.sha256)
          test "$(jq -r .package.sha256 "$report")" = "$zip_sha"
          test "$(jq -r .package.sourceCommit "$report")" = "$BETA_SOURCE_COMMIT"
          test "$(jq -r .generation "$report")" = ci-final-head
          test "$(jq '.outputs | length' "$report")" = 4
          jq '{generation, package, browser, storeIcon: .storeIcon.alphaBounds, outputs: [.outputs[] | {file, width, height, bytes, sha256}]}' "$report"
      # Independent cross-check of the archive with standard tools.
      - name: Check beta archive checksum and listing
        working-directory: artifacts/beta
        run: |
          sha256sum -c refund-reconciler-beta-*.zip.sha256
          unzip -l refund-reconciler-beta-*.zip
      # The finalized publisher site must pass the publication gate. Read-only:
      # this deploys nothing (deployment is the separate manual workflow).
      - name: Publication check of the finalized publisher site
        run: npm run site:publication-check
      # Static publisher site (docs/store/publisher-site.md): checks it, then
      # stages exactly its files plus a provenance report. Not deployed.
      - name: Check and stage the publisher site
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run site:artifact
          report=artifacts/publisher-site/publisher-site-report.json
          test "$(jq -r .sourceCommit "$report")" = "$BETA_SOURCE_COMMIT"
          test "$(jq -r .checkoutCommit "$report")" = "$(git rev-parse HEAD)"
          test "$(jq -r .generation "$report")" = ci-final-head
          test "$(jq '.files | length' "$report")" = 7
          jq '{generation, sourceCommit, checkoutCommit, workingTreeClean, policySource, totalBytes, files}' "$report"
          cd artifacts/publisher-site/site
          test "$(find . -type f | wc -l)" = 7
          find . -type f | sort
          find . -type f -print0 | sort -z | xargs -0 sha256sum
      # Owner handoff for the unlisted beta (docs/store/submission-handoff.md):
      # the verified ZIP and store images above, unchanged, plus paste-ready
      # text. Builds nothing and refuses missing, changed or mismatched inputs.
      # Prepares files only: nothing is uploaded to or submitted in the store.
      - name: Assemble and check the store handoff
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run store:handoff
          report=artifacts/store-handoff/store-handoff-report.json
          zip_sha=$(cut -d' ' -f1 artifacts/beta/refund-reconciler-beta-*.zip.sha256)
          test "$(jq -r .package.sha256 "$report")" = "$zip_sha"
          test "$(jq -r .sourceCommit "$report")" = "$BETA_SOURCE_COMMIT"
          test "$(jq -r .checkoutCommit "$report")" = "$(git rev-parse HEAD)"
          test "$(jq -r .generation "$report")" = ci-final-head
          test "$(jq -r .storeAssets.generation "$report")" = ci-final-head
          cd artifacts/store-handoff
          sha256sum -c refund-reconciler-store-handoff-*.zip.sha256
          rm -rf extracted && mkdir extracted
          unzip -q refund-reconciler-store-handoff-*.zip -d extracted
          (cd extracted && jq -r '.files[] | "\(.sha256)  \(.path)"' inventory.json | sha256sum -c --quiet)
          test "$(find extracted -type f | wc -l)" = "$(( $(jq '.files | length' extracted/inventory.json) + 1 ))"
          cmp extracted/extension/refund-reconciler-beta-*.zip ../beta/refund-reconciler-beta-*.zip
          # Handoff material never enters the extension or the site.
          unexpected=$(unzip -Z1 ../beta/refund-reconciler-beta-*.zip | grep -v -E '^(manifest\.json|(dashboard|popup)\.html|(dashboard|popup|background)\.js|chunks/[A-Za-z0-9_-]+\.js|assets/[A-Za-z0-9_-]+\.css|icons/icon-(16|32|48|128)\.png)$' || true)
          test -z "$unexpected"
          test "$(find ../publisher-site/site -type f | wc -l)" = 7
          rm -rf extracted
          jq '{generation, sourceCommit, checkoutCommit, run, package, storeAssets, handoff, inventory, files: [.files[] | {path, bytes, sha256}]}' store-handoff-report.json
      # A build artifact for manual testing, not a release or store upload.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: refund-reconciler-beta
          path: |
            artifacts/beta/refund-reconciler-beta-*.zip
            artifacts/beta/refund-reconciler-beta-*.zip.sha256
            artifacts/beta/refund-reconciler-beta-*.report.json
          if-no-files-found: error
          retention-days: 14
      # Listing images and their provenance report, separate from the beta ZIP.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: refund-reconciler-store-assets
          path: |
            artifacts/store-assets/*.png
            artifacts/store-assets/store-assets-report.json
            artifacts/store-assets/capture.json
            artifacts/store-assets/preview.html
          if-no-files-found: error
          retention-days: 14
      # The owner's store handoff: one archive, its checksum and its report.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: refund-reconciler-store-handoff
          path: |
            artifacts/store-handoff/refund-reconciler-store-handoff-*.zip
            artifacts/store-handoff/refund-reconciler-store-handoff-*.zip.sha256
            artifacts/store-handoff/store-handoff-report.json
          if-no-files-found: error
          retention-days: 14
      # Only the static site and its report (outside the site folder).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: refund-reconciler-publisher-site
          path: |
            artifacts/publisher-site/site/
            artifacts/publisher-site/publisher-site-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Windows: unit tests on a CRLF checkout and the full same-installation
  # update checks (0.5.0, 0.6.0 and 0.7.0 built from source, updated in place to the beta ZIP).
  # The Ubuntu job above runs the complete browser suite and uploads the artifact.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Git for Windows' default; set explicitly so the checkout really is CRLF.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Confirm a CRLF checkout
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText('.github/workflows/ci.yml')
          if (-not $text.Contains("`r`n")) { throw 'ci.yml was not checked out with CRLF line endings' }
          Write-Output 'ci.yml has CRLF line endings'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - name: Fetch update-check baseline (Task 05, 0.5.0)
        run: git fetch --no-tags --depth=1 origin b323930f7d9580f426e7e8fee39b4242143c4844
      - name: Fetch update-check baseline (Task 07.1, 0.6.0)
        run: git fetch --no-tags --depth=1 origin 60e330b12d195908a44ad341a73e34678a5a697d
      - name: Fetch update-check baseline (Task 09.1, 0.7.0)
        run: git fetch --no-tags --depth=1 origin da475840933b21eab85553e8b2ad54c3e049bf90
      - run: npm run test:update
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-windows
          path: test-results/
          retention-days: 7
