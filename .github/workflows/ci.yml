name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Builds, verifies and smoke-tests the installable beta ZIP (see docs/beta.md).
      - run: npm run test:package
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Same-installation update check (docs/beta.md): builds the previous
      # production version, 0.5.0, from its own source at this immutable commit,
      # which the shallow checkout does not contain.
      - name: Fetch update-check baseline (Task 05, 0.5.0)
        run: git fetch --no-tags --depth=1 origin b323930f7d9580f426e7e8fee39b4242143c4844
      - run: npm run test:update
        env:
          BETA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Independent cross-check of the archive with standard tools.
      - name: Check beta archive checksum and listing
        working-directory: artifacts/beta
        run: |
          sha256sum -c refund-reconciler-beta-*.zip.sha256
          unzip -l refund-reconciler-beta-*.zip
      # A build artifact for manual testing, not a release or store upload.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: refund-reconciler-beta
          path: |
            artifacts/beta/refund-reconciler-beta-*.zip
            artifacts/beta/refund-reconciler-beta-*.zip.sha256
            artifacts/beta/refund-reconciler-beta-*.report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Windows: unit tests on a CRLF checkout and the full same-installation
  # update check (0.5.0 built from source, updated in place to the beta ZIP).
  # The Ubuntu job above runs the complete browser suite and uploads the artifact.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Git for Windows' default; set explicitly so the checkout really is CRLF.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Confirm a CRLF checkout
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText('.github/workflows/ci.yml')
          if (-not $text.Contains("`r`n")) { throw 'ci.yml was not checked out with CRLF line endings' }
          Write-Output 'ci.yml has CRLF line endings'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - name: Fetch update-check baseline (Task 05, 0.5.0)
        run: git fetch --no-tags --depth=1 origin b323930f7d9580f426e7e8fee39b4242143c4844
      - run: npm run test:update
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-windows
          path: test-results/
          retention-days: 7
